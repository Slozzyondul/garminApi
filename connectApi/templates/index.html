{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Login to Garmin Connect</h3>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                
                <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                <div id="successMessage" class="alert alert-success mt-3 d-none"></div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5>Upload FIT File</h5>
                <form id="uploadForm">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="fitFile" accept=".fit">
                    </div>
                    <button type="submit" class="btn btn-secondary w-100">Analyze FIT File</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
